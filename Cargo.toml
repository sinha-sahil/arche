[package]
name = "arche"
version = "4.17.2"
edition = "2024"
description = "An opinionated backend foundation for Axum applications, providing batteries-included integrations for cloud services, databases, authentication, middleware, and logging."
authors = ["Sahil Sinha"]
repository = "https://github.com/sinha-sahil/arche"
homepage = "https://github.com/sinha-sahil/arche"
documentation = "https://docs.rs/arche"
license = "MIT"
keywords = ["axum", "backend", "middleware", "cloud", "database"]
categories = [
    "web-programming",
    "web-programming::http-server",
    "authentication",
    "database",
]
readme = "README.md"
exclude = [".gitignore", ".vscode/*"]

[features]
default = []
verbose-errors = []
queue = ["dep:rdkafka"]

[dependencies]
aws-config = "1.8.12"
aws-sdk-s3 = "1.117.0"
serde = { version = "1.0.228", features = ["derive"] }
bb8-redis = "0.26.0"
bb8 = "0.9.1"
clickhouse = { version = "0.13", features = ["lz4", "time", "uuid"] }
regex = "1"
dotenv = "0.15.0"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "uuid",
    "time",
] }
serde_json = "1.0.145"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
thiserror = "2.0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
nanoid = "0.4.0"
time = "0.3.44"
axum = { version = "0.8.7", features = ["json", "multipart"] }
tokio = { version = "1.4.0", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
    "fs",
    "sync",
] }
tokio-util = { version = "0.7", features = ["io-util"] }
tokio-stream = "0.1"
aws-sdk-sesv2 = "1.111.0"
aws-sdk-kms = "1.68.0"
aws-sdk-cloudfront = "1.118.0"
csv-async = { version = "1.3", features = ["tokio", "with_serde"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
base64 = "0.22.1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
rsa = "0.9"
senno = { version = "0.6.0", features = ["vertex", "axum", "mcp"] }
sha2 = { version = "0.10", features = ["oid"] }
hex = "0.4"
percent-encoding = "2.3"
rdkafka = { version = "0.39", features = ["ssl-vendored", "zstd"], optional = true }

[dev-dependencies]
cargo-husky = { version = "1", features = ["user-hooks"] }
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
