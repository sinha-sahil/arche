[package]
name = "arche"
version = "2.1.1"
edition = "2024"
description = "An opinionated backend foundation for Axum applications, providing batteries-included integrations for cloud services, databases, authentication, middleware, and logging."
authors = ["Sahil Sinha"]
repository = "https://github.com/sinha-sahil/arche"
homepage = "https://github.com/sinha-sahil/arche"
documentation = "https://docs.rs/arche"
license = "MIT"
keywords = ["axum", "backend", "middleware", "cloud", "database"]
categories = [
    "web-programming",
    "web-programming::http-server",
    "authentication",
    "database",
]
readme = "README.md"
exclude = [".gitignore", ".vscode/*"]

[dependencies]
aws-config = "1.8.12"
aws-sdk-s3 = "1.117.0"
serde = { version = "1.0.228", features = ["derive"] }
bb8-redis = "0.26.0"
bb8 = "0.9.1"
dotenv = "0.15.0"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "uuid",
    "time",
] }
serde_json = "1.0.145"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
thiserror = "2.0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
nanoid = "0.4.0"
time = "0.3.44"
axum = { version = "0.8.7", features = ["json", "multipart"] }
google-sheets4 = "6.0.0"
google-drive3 = "6.0.0"
tokio = { version = "1.4.0", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
    "fs",
    "sync",
] }
tokio-util = { version = "0.7", features = ["io-util"] }
tokio-stream = "0.1"
aws-sdk-sesv2 = "1.111.0"
aws-sdk-kms = "1.68.0"
csv-async = { version = "1.3", features = ["tokio", "with_serde"] }
reqwest = { version = "0.12", features = ["stream"] }
base64 = "0.22.1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"

[dev-dependencies]
cargo-husky = { version = "1", features = ["user-hooks"] }
